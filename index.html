<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIII</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .caption {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
        }

        .answer-box {
            width: 80%;
            max-width: 500px;
            box-sizing: border-box;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 10px;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
            color: black;
        }

        #message {
            margin-top: 15px;
        }

        .binary {
            word-break: break-word;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #puzzle {
            width: 100%;
            max-width: 700px;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .fade-in {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>

<body>

<div id="puzzle"></div>

<script>
    const API = "https://puzzle-backend-1.onrender.com";

    let sessionId = localStorage.getItem("puzzleSession");

    async function loadPuzzle() {
        try {
            const headers = {};

            if (sessionId) {
                headers["x-session-id"] = sessionId;
            }

            const response = await fetch(`${API}/puzzle`, {
                headers: headers
            });

            if (!response.ok) {
                throw new Error("Failed to load puzzle");
            }

            const puzzle = await response.json();

            sessionId = puzzle.sessionId;
            localStorage.setItem("puzzleSession", sessionId);

            displayPuzzle(puzzle);

        } catch (error) {
            console.error(error);

            document.getElementById("puzzle").innerHTML =
                "<div>Unable to connect to the puzzle server.</div>";
        }
    }

    function displayPuzzle(puzzle) {
        const container = document.getElementById("puzzle");

        container.innerHTML = "";

        const content = document.createElement("div");

        content.className = "fade-in";

        const caption = document.createElement("div");
        caption.className = "caption";
        caption.innerHTML = puzzle.caption;

        content.appendChild(caption);

        if (puzzle.hint) {
            const hint = document.createElement("div");
            hint.className = "binary";
            hint.textContent = puzzle.hint;

            content.appendChild(hint);
        }

        if (puzzle.image) {
            const image = document.createElement("img");

            image.src = `${API}${puzzle.image}`;
            image.alt = "";

            content.appendChild(image);
        }

        if (puzzle.extraText) {
            const extraText = document.createElement("div");
            extraText.className = "caption";
            extraText.textContent = puzzle.extraText;

            content.appendChild(extraText);
        }

        const input = document.createElement("input");

        input.type = "text";
        input.id = "answer";
        input.className = "answer-box";
        input.placeholder = "enter your answer...";

        content.appendChild(input);
        content.appendChild(document.createElement("br"));

        const button = document.createElement("button");

        button.textContent = "SUBMIT";

        content.appendChild(button);

        const message = document.createElement("div");

        message.id = "message";

        content.appendChild(message);

        container.appendChild(content);

        setTimeout(() => {
            content.style.opacity = "1";
        }, 50);

        button.addEventListener("click", () => {
            submitAnswer(input, button, message, content);
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                submitAnswer(input, button, message, content);
            }
        });
    }

    async function submitAnswer(input, button, message, content) {
        if (button.disabled) return;

        button.disabled = true;

        try {
            const response = await fetch(`${API}/answer`, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "x-session-id": sessionId
                },

                body: JSON.stringify({
                    answer: input.value
                })
            });

            const result = await response.json();

            if (result.correct) {
                message.textContent = result.message;

                setTimeout(() => {
                    content.classList.add("fade-out");

                    setTimeout(() => {
                        loadPuzzle();
                    }, 1500);

                }, 1000);

            } else {
                message.textContent = "WRONG. try again.";
                button.disabled = false;
            }

        } catch (error) {
            console.error(error);

            message.textContent = "Unable to contact the server.";
            button.disabled = false;
        }
    }

    loadPuzzle();
</script>

</body>
</html>
