<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIII</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
        }

        .caption {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .engarde,
        .whaddupnerd {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
        }

        .answer-box {
            width: 80%;
            max-width: 500px;
            box-sizing: border-box;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }

        .answer-box:focus {
            border-color: #aaa;
        }

        button {
            margin-top: 10px;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
            color: black;
        }

        #message,
        #message-two {
            margin-top: 15px;
        }

        .fade-out {
            transition: opacity 1.5s ease;
            opacity: 0;
        }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .binary {
            word-break: break-word;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <div id="part-one">
        <div class="caption">
            hey whats up NERD welcome to my AWESOME PUZZLE!!!<br>
            if youre reading this then youre probably shu hi<br>
            i just rushed this really quick cause im a chud<br>
            if you need a hint just like. dm me. ok? ok
        </div>
        <img src="engarde.png" alt="engarde" class="engarde">
        <input type="text" id="answer" class="answer-box" placeholder="enter your answer..."><br>
        <button id="submit-one" onclick="checkAnswer()">SUBMIT</button>
        <div id="message"></div>
    </div>
</div>

<script>
    let puzzleOneSolved = false;
    let puzzleTwoSolved = false;

    // Puzzle 2 HTML markup stored in JS memory (not visible in the initial DOM tree)
    const puzzleTwoHTML = `
        <div id="part-two" class="fade-in">
            <div class="caption">
                wow maybe youre not an idiot okay oh shit uh take THIS<br><br>
                <span class="binary">
                    01000001 00111000 00100000 01000011 00110111
                    00100000 01000011 00110110 00100000 01000100
                    00110111 00100000 01000001 00110001 00100000
                    01000111 00110001 00100000 01000101 00110010
                    00100000 01000011 00110001 00100000 01000111
                    00110010 00100000 01000100 00110113 00100000
                    01000100 00110101
                </span>
            </div>
            <img src="whaddupnerd.png" alt="whaddup nerd" class="whaddupnerd">
            <div class="caption">
                your job is to find a NAME a PERSON an ARTIST ok ok? ok bye nerd
            </div>
            <input type="text" id="answer-two" class="answer-box" placeholder="enter your answer..."><br>
            <button id="submit-two" onclick="checkSecondAnswer()">SUBMIT</button>
            <div id="message-two"></div>
        </div>
    `;

    function playYippee() {
        const audio = new Audio("yippee.mp3");
        audio.play().catch(function(error) {
            console.log("Audio playback error:", error);
        });
    }

    // Hashes input text with SHA-256 so plaintext answers don't appear in source code
    async function hashText(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function checkAnswer() {
        if (puzzleOneSolved) return;

        const answer = document.getElementById("answer").value.trim().toLowerCase();
        const message = document.getElementById("message");
        const hashedInput = await hashText(answer);

        // SHA-256 hash for "martyr"
        const hashOne = "a1c0d45672d348a7b9dd4b9fa372f5cb3c8800b4624d7d13e9a4f4e7c0500e2b";

        if (hashedInput === hashOne) {
            puzzleOneSolved = true;
            document.getElementById("submit-one").disabled = true;

            playYippee();
            message.textContent = "CORRECT!!!";

            setTimeout(function() {
                const partOne = document.getElementById("part-one");
                partOne.classList.add("fade-out");

                setTimeout(function() {
                    // Remove puzzle 1 completely from the DOM
                    partOne.remove();

                    // Inject puzzle 2 HTML into the page
                    const app = document.getElementById("app");
                    app.innerHTML = puzzleTwoHTML;
                }, 1500);
            }, 1000);
        } else {
            message.textContent = "WRONG. try again.";
        }
    }

    async function checkSecondAnswer() {
        if (puzzleTwoSolved) return;

        const answer = document.getElementById("answer-two").value.trim().toLowerCase();
        const message = document.getElementById("message-two");
        const hashedInput = await hashText(answer);

        // SHA-256 hash for "zuntata"
        const hashTwo = "29b86ee9db5642a4a7cf52ce032a188f6197fa14aa3508d4bb00ea4326f63be3";

        if (hashedInput === hashTwo) {
            puzzleTwoSolved = true;
            playYippee();
            message.textContent = "WOW YOU DID IT OK ???????";
            document.getElementById("submit-two").disabled = true;
        } else {
            message.textContent = "WRONG. try again.";
        }
    }
</script>
</body>
</html>
