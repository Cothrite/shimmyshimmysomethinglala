<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIII</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #app {
            width: 90%;
            max-width: 700px;
        }

        .caption {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
        }

        .answer-box {
            width: 80%;
            max-width: 500px;
            box-sizing: border-box;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px;
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 10px;
            background-color: black;
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            font-family: monospace;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: white;
            color: black;
        }

        #message, #message-two {
            margin-top: 15px;
        }

        .binary {
            word-break: break-word;
            line-height: 1.6;
        }

        .fade-out {
            transition: opacity 1.5s ease;
            opacity: 0;
        }

        .fade-in {
            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- ONLY PUZZLE 1 IS PRESENT ON LOAD -->
    <div id="part-one">
        <div class="caption">
            hey whats up NERD welcome to my AWESOME PUZZLE!!!<br>
            if youre reading this then youre probably shu hi<br>
            i just rushed this really quick cause im a chud<br>
            if you need a hint just like. dm me. ok? ok
        </div>
        <img src="engarde.png" alt="engarde">
        <input type="text" id="answer" class="answer-box" placeholder="enter your answer..."><br>
        <button id="submit-one" onclick="checkAnswer()">SUBMIT</button>
        <div id="message"></div>
    </div>
</div>

<script>
    let puzzleOneSolved = false;
    let puzzleTwoSolved = false;

    // Puzzle 2 markup stored in JS memory - not in DOM initially
    const puzzleTwoHTML = `
        <div id="part-two" class="fade-in">
            <div class="caption">
                wow maybe youre not an idiot okay oh shit uh take THIS<br><br>
                <span class="binary">
                    01000001 00111000 00100000 01000011 00110111
                    00100000 01000011 00110110 00100000 01000100
                    00110111 00100000 01000001 00110001 00100000
                    01000111 00110001 00100000 01000101 00110010
                    00100000 01000011 00110001 00100000 01000111
                    00110010 00100000 01000100 00110011 00100000
                    01000100 00110101
                </span>
            </div>
            <img src="whaddupnerd.png" alt="whaddup nerd">
            <div class="caption">your job is to find a NAME a PERSON an ARTIST ok ok? ok bye nerd</div>
            <input type="text" id="answer-two" class="answer-box" placeholder="enter your answer..."><br>
            <button id="submit-two" onclick="checkSecondAnswer()">SUBMIT</button>
            <div id="message-two"></div>
        </div>
    `;

    // Audio instantiated dynamically in memory (no audio tag in DOM)
    function playYippee() {
        const audio = new Audio("yippee.mp3");
        audio.play().catch(err => console.log("Audio playback error:", err));
    }

    // SHA-256 helper function to avoid exposing plaintext answers in DevTools
    async function hashText(text) {
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer))
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");
    }

    async function checkAnswer() {
        if (puzzleOneSolved) return;

        const input = document.getElementById("answer").value.trim().toLowerCase();
        const hashedInput = await hashText(input);

        // SHA-256 hash for "martyr"
        const targetHash = "a310bb2692ff8310f545fa63519d0840523ec33235ffb0f19c9616781ebca4eb";

        if (hashedInput === targetHash) {
            puzzleOneSolved = true;
            document.getElementById("submit-one").disabled = true;
            playYippee();
            document.getElementById("message").textContent = "CORRECT!!!";

            setTimeout(() => {
                const partOne = document.getElementById("part-one");
                partOne.classList.add("fade-out");

                setTimeout(() => {
                    // Completely remove Puzzle 1 from the DOM
                    partOne.remove();

                    // Inject Puzzle 2 into the DOM
                    const app = document.getElementById("app");
                    app.innerHTML = puzzleTwoHTML;
                }, 1500);
            }, 1000);
        } else {
            document.getElementById("message").textContent = "WRONG. try again.";
        }
    }

    async function checkSecondAnswer() {
        if (puzzleTwoSolved) return;

        const input = document.getElementById("answer-two").value.trim().toLowerCase();
        const hashedInput = await hashText(input);

        // SHA-256 hash for "zuntata"
        const targetHash = "29b86ee9db5642a4a7cf52ce032a188f6197fa14aa3508d4bb00ea4326f63be3";

        if (hashedInput === targetHash) {
            puzzleTwoSolved = true;
            playYippee();
            document.getElementById("message-two").textContent = "WOW YOU DID IT OK ???????";
            document.getElementById("submit-two").disabled = true;
        } else {
            document.getElementById("message-two").textContent = "WRONG. try again.";
        }
    }
</script>
</body>
</html>
